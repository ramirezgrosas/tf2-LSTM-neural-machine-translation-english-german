[project]
name = "tf2-lstm-neural-machine-translation-english-german"
version = "0.1.0"
description = "Encoder-decoder LSTM for English-to-German neural machine translation, built with TensorFlow 2 (Keras) using a pre-trained word embedding and a custom training loop."
readme = "README.md"
authors = [
    { name = "Diego Ramirez Rosas", email = "ramirezgrosas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "setuptools<82",
    "tensorflow>=2.21.0",
    "tensorflow-hub>=0.16.1",
]

[project.scripts]
tf2-lstm-neural-machine-translation-english-german = "tf2_lstm_neural_machine_translation_english_german:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
